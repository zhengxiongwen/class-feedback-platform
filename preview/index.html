<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="班级问题反馈平台——学生反馈、班委接单、教师监督、成果展示的一站式班级治理工具">
<title>班级问题反馈平台</title>
<style>
:root{
  --primary:#4f6df5; --primary-dark:#3a54c4; --accent:#07c160;
  --bg:#f3f5fa; --card:#ffffff; --text:#1f2430; --muted:#8a92a6;
  --hot:#ff5a3c; --ok:#22b573; --warn:#f5a623; --danger:#e6484d;
  --radius:14px; --shadow:0 4px 16px rgba(31,36,48,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
button{cursor:pointer;font-family:inherit}
.hidden{display:none!important}

/* ============ 落地页 / 登录页 ============ */
#landing{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#4f6df5 0%,#7a5af8 55%,#b15af8 100%);padding:24px;color:#fff;text-align:center}
#landing h1{font-size:clamp(28px,6vw,44px);margin-bottom:10px;letter-spacing:2px}
#landing .slogan{opacity:.85;margin-bottom:36px;font-size:clamp(14px,3vw,18px)}
.login-card{background:#fff;color:var(--text);border-radius:20px;padding:32px 28px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:left}
.login-card h2{font-size:18px;margin-bottom:16px}
.wx-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.wx-btn:hover{background:#06ad56}
.wx-btn svg{width:22px;height:22px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e6e8ef}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.role-btn{border:2px solid #e6e8ef;background:#fafbfe;border-radius:12px;padding:14px 6px;font-size:15px;font-weight:600;transition:.15s}
.role-btn.active{border-color:var(--primary);background:#eef1ff;color:var(--primary)}
#cadre-picker{margin-top:14px}
#cadre-picker label{font-size:13px;color:var(--muted);display:block;margin-bottom:8px}
.cadre-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cadre-btn{border:1.5px solid #e6e8ef;background:#fff;border-radius:10px;padding:9px 4px;font-size:13px}
.cadre-btn.active{border-color:var(--accent);background:#e8fbf1;color:#079e50;font-weight:600}
.name-input{width:100%;border:1.5px solid #e6e8ef;border-radius:10px;padding:11px 12px;font-size:14px;margin-top:14px}
#enter-btn{width:100%;margin-top:16px;background:var(--primary);color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600}
#enter-btn:disabled{background:#c4cadd;cursor:not-allowed}
.login-tip{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}

/* ============ 平台主体 ============ */
header{position:sticky;top:0;z-index:50;background:var(--card);box-shadow:var(--shadow)}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;color:var(--primary);white-space:nowrap}
.user-chip{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.user-chip .badge{background:#eef1ff;color:var(--primary);border-radius:999px;padding:4px 12px;font-weight:600}
#logout-btn{border:1px solid #e6e8ef;background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
nav.tabs{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:0 8px;overflow-x:auto}
.tab{flex:1;min-width:120px;border:none;background:none;padding:12px 8px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}

/* 卡片与表单 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:16px;background:var(--primary);border-radius:2px}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
select,input[type=text],textarea{width:100%;border:1.5px solid #e6e8ef;border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;background:#fff}
textarea{min-height:110px;resize:vertical}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--primary)}
.submit-btn{margin-top:16px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-weight:600}
.submit-btn:hover{background:var(--primary-dark)}

/* 问题卡片 */
.issue{border:1px solid #eef0f5;border-radius:var(--radius);padding:16px;margin-bottom:12px;background:#fff;transition:.15s}
.issue:hover{box-shadow:var(--shadow)}
.issue-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:12px;border-radius:999px;padding:3px 10px;font-weight:600}
.tag-type{background:#eef1ff;color:var(--primary)}
.tag-status-open{background:#fff4e5;color:var(--warn)}
.tag-status-doing{background:#e8f1ff;color:var(--primary)}
.tag-status-done{background:#e8fbf1;color:var(--ok)}
.tag-hot{background:#ffeae6;color:var(--hot)}
.issue-title{font-weight:700;font-size:15px}
.issue-content{font-size:14px;color:#4a5165;margin:6px 0 10px;line-height:1.6}
.issue-meta{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.issue-actions{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.like-btn{border:1.5px solid #e6e8ef;background:#fff;border-radius:999px;padding:6px 16px;font-size:14px;display:flex;align-items:center;gap:6px;transition:.15s}
.like-btn.liked{border-color:var(--hot);color:var(--hot);background:#fff3f1}
.act-btn{border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;color:#fff}
.act-accept{background:var(--primary)}
.act-resolve{background:var(--ok)}
.sla{font-size:12px;font-weight:700;border-radius:8px;padding:5px 10px}
.sla-ok{background:#e8fbf1;color:var(--ok)}
.sla-warn{background:#fff4e5;color:var(--warn)}
.sla-over{background:#ffe9ea;color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:48px 0;font-size:14px}

/* 成就栏时间线 */
.trace{margin-top:12px;border-left:3px solid #e6e8ef;padding-left:16px;display:flex;flex-direction:column;gap:10px}
.trace-item{position:relative;font-size:13px;color:#4a5165}
.trace-item::before{content:"";position:absolute;left:-22px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px #d8defc}
.trace-item small{color:var(--muted);margin-left:8px}
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filter-bar select{width:auto;min-width:140px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:up .25s}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

@media(max-width:640px){
  .role-grid,.cadre-grid{grid-template-columns:repeat(3,1fr)}
  .header-inner{padding:10px 12px}
  main{padding:14px 12px 48px}
  .tab{font-size:14px;min-width:100px}
}
</style>
</head>
<body>

<!-- ==================== 一、落地页 / 登录页 ==================== -->
<section id="landing">
  <h1>班级问题反馈平台</h1>
  <p class="slogan">有问必提 · 有单必接 · 件件有回音</p>
  <div class="login-card">
    <h2>登录 / 选择身份</h2>
    <button class="wx-btn" id="wx-login">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.7 4C4.9 4 2 6.6 2 9.9c0 1.9 1 3.5 2.6 4.6l-.7 2.2 2.6-1.3c.6.2 1.4.3 2.2.3h.6A6.3 6.3 0 0 1 9 13.5C9 10.2 11.9 7.5 15.6 7.5h.5C15.5 5.4 12.5 4 8.7 4zm-2 3.1a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8zm4.2 0a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8zM22 13.6c0-2.7-2.4-4.9-5.4-4.9s-5.4 2.2-5.4 4.9 2.4 4.9 5.4 4.9c.6 0 1.2-.1 1.8-.3l2.2 1.1-.6-1.9A4.7 4.7 0 0 0 22 13.6zm-7.3-1.5a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6zm3.9 0a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6z"/></svg>
      微信一键登录
    </button>
    <div class="divider">登录后选择你的角色</div>
    <div class="role-grid" id="role-grid">
      <button class="role-btn" data-role="student">🎓 学生</button>
      <button class="role-btn" data-role="cadre">⭐ 学术骨干</button>
      <button class="role-btn" data-role="teacher">👩‍🏫 教师</button>
    </div>
    <div id="cadre-picker" class="hidden">
      <label>请选择你的干部身份：</label>
      <div class="cadre-grid" id="cadre-grid"></div>
    </div>
    <input class="name-input" id="name-input" type="text" placeholder="输入你的姓名（如：张三）" maxlength="10">
    <button id="enter-btn" disabled>进入问题反馈平台 →</button>
    <p class="login-tip">演示版本：微信登录为模拟流程，数据保存在本机浏览器中</p>
  </div>
</section>

<!-- ==================== 二、平台主体 ==================== -->
<div id="app" class="hidden">
  <header>
    <div class="header-inner">
      <div class="logo">📋 班级问题反馈平台</div>
      <div class="user-chip">
        <span class="badge" id="user-role-badge"></span>
        <span id="user-name"></span>
        <button id="logout-btn">退出</button>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="submit">✏️ 问题反馈</button>
      <button class="tab" data-tab="plaza">🔥 问题广场</button>
      <button class="tab" data-tab="orders">📥 班委接单</button>
      <button class="tab" data-tab="hall">🏆 问题成就栏</button>
    </nav>
  </header>
  <main>
    <!-- 1. 问题反馈 -->
    <section id="tab-submit">
      <div class="card">
        <h3>提交新问题</h3>
        <label class="f">问题类型</label>
        <select id="f-type">
          <option>学习学业</option><option>生活服务</option><option>班级活动</option>
          <option>心理健康</option><option>组织建设</option><option>文体事务</option>
          <option>宣传事务</option><option>其他</option>
        </select>
        <label class="f">问题标题</label>
        <input type="text" id="f-title" maxlength="40" placeholder="一句话概括问题">
        <label class="f">问题内容</label>
        <textarea id="f-content" placeholder="请详细描述问题经过、涉及范围和期望的解决方式…"></textarea>
        <label class="f">问题负责人（指定对接班委）</label>
        <select id="f-owner"></select>
        <button class="submit-btn" id="f-submit">提交反馈</button>
      </div>
      <div class="card">
        <h3>我的反馈记录</h3>
        <div id="my-issues"></div>
      </div>
    </section>

    <!-- 2. 问题广场 -->
    <section id="tab-plaza" class="hidden">
      <div class="filter-bar">
        <select id="plaza-filter">
          <option value="all">全部类型</option>
          <option>学习学业</option><option>生活服务</option><option>班级活动</option>
          <option>心理健康</option><option>组织建设</option><option>文体事务</option>
          <option>宣传事务</option><option>其他</option>
        </select>
        <select id="plaza-sort">
          <option value="hot">🔥 热度优先</option>
          <option value="new">🕐 最新优先</option>
        </select>
      </div>
      <div id="plaza-list"></div>
    </section>

    <!-- 3. 班委接单 -->
    <section id="tab-orders" class="hidden">
      <div class="card" id="orders-info"></div>
      <div class="filter-bar">
        <select id="orders-filter">
          <option value="mine">我负责的问题</option>
          <option value="pending">待接单（全班级）</option>
          <option value="doing">处理中</option>
        </select>
      </div>
      <div id="orders-list"></div>
    </section>

    <!-- 4. 问题成就栏 -->
    <section id="tab-hall" class="hidden">
      <div class="card" style="background:linear-gradient(120deg,#fff8ec,#fff);border:1px solid #ffe1b3">
        <h3>🏆 已解决的问题（按点赞数排序）</h3>
        <div id="hall-list"></div>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";
/* ================= 数据层（localStorage 持久化） ================= */
const CADRES = ["班长","团支书","组织委员","学习委员","文艺委员","体育委员","心理委员","宣传委员","生活委员"];
const SLA_HOURS = 48;                 // 处理承诺：接单后 48 小时内解决
const HOT_WINDOW = 48;                // 热度：近48小时点赞权重加倍

/* ===== 环境隔离：预览站与正式站共用同一份代码，靠 URL 路径区分 =====
   /preview/  = 预览环境（改代码先看这里，数据独立，随便测试不污染正式数据）
   /          = 正式环境（同学使用的地址）                              */
const IS_PREVIEW = location.pathname.replace(/\/+$/, "").endsWith("/preview");
const DB_KEY = IS_PREVIEW ? "class_feedback_db_preview_v1" : "class_feedback_db_v1";
if (IS_PREVIEW) {
  const badge = document.createElement("div");
  badge.textContent = "🧪 预览版 · 尚未发布";
  badge.style.cssText = "position:fixed;top:0;right:0;z-index:999;background:#f5a623;color:#fff;font-size:12px;font-weight:700;padding:6px 14px;border-radius:0 0 0 10px;box-shadow:0 2px 8px rgba(0,0,0,.2)";
  document.body.appendChild(badge);
}

let db = loadDB();
let session = null;

function loadDB(){
  try{ const d = JSON.parse(localStorage.getItem(DB_KEY)); if(d && Array.isArray(d.issues)) return d; }catch(e){}
  return seedDB();
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function seedDB(){
  const now = Date.now();
  const d = { issues:[
    { id:"i1", type:"学习学业", title:"晚自习教室占座严重", content:"期末周自习室座位紧张，存在用书占座一整天不来的情况，希望制定座位使用规范。", owner:"学习委员", author:"李同学", status:"resolved", likes:["a","b","c","d","e"], createdAt:now-6*864e5,
      trace:[{t:now-6*864e5, text:"李同学 提交了问题"},{t:now-5.8*864e5, text:"学习委员 接单，承诺 48 小时内处理"},{t:now-4*864e5, text:"发布《自习座位公约》，每日 21:00 清理占座物品"},{t:now-3*864e5, text:"学习委员 标记为已解决，SLA 达标 ✅"}]},
    { id:"i2", type:"生活服务", title:"宿舍热水供应时间太短", content:"冬天热水只供应到晚上 10 点，晚自习后回去经常没热水洗澡。", owner:"生活委员", author:"王同学", status:"doing", likes:["a","b","c"], createdAt:now-2*864e5, acceptedAt:now-1.5*864e5,
      trace:[{t:now-2*864e5, text:"王同学 提交了问题"},{t:now-1.5*864e5, text:"生活委员 接单，承诺 48 小时内处理"},{t:now-1*864e5, text:"已与后勤处沟通，正在协商延长供应至 23:30"}]},
    { id:"i3", type:"班级活动", title:"建议组织一次秋游团建", content:"期中后大家压力较大，建议组织一次户外团建增进感情。", owner:"文艺委员", author:"赵同学", status:"open", likes:["a","b"], createdAt:now-0.5*864e5,
      trace:[{t:now-0.5*864e5, text:"赵同学 提交了问题"}]}
  ]};
  localStorage.setItem(DB_KEY, JSON.stringify(d));
  return d;
}

/* ================= 工具函数 ================= */
const $ = s => { const el = document.querySelector(s); return el; };
const fmtTime = t => new Date(t).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
function hotScore(i){
  const now = Date.now();
  return i.likes.reduce((s,_,idx)=> s + (now - i.createdAt < HOT_WINDOW*36e5 ? 2 : 1), 0)
    + Math.max(0, 5 - (now-i.createdAt)/864e5); // 新鲜度加成
}
function slaInfo(i){
  if(i.status!=="doing" || !i.acceptedAt) return null;
  const left = i.acceptedAt + SLA_HOURS*36e5 - Date.now();
  if(left < 0) return {cls:"sla-over", text:`已超时 ${Math.floor(-left/36e5)}h`};
  const h = Math.floor(left/36e5);
  return h < 12 ? {cls:"sla-warn", text:`剩余 ${h}h（即将超时）`} : {cls:"sla-ok", text:`SLA 剩余 ${h}h`};
}
const esc = s => s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= 登录页逻辑 ================= */
const roleGrid = $("#role-grid"), cadrePicker = $("#cadre-picker"), cadreGrid = $("#cadre-grid"),
      nameInput = $("#name-input"), enterBtn = $("#enter-btn");
let pickedRole = null, pickedCadre = null;

CADRES.forEach(c=>{
  const b = document.createElement("button");
  b.className="cadre-btn"; b.textContent=c; b.dataset.cadre=c;
  cadreGrid.appendChild(b);
});
$("#wx-login").addEventListener("click", ()=> toast("✅ 微信授权成功（模拟登录）"));
roleGrid.addEventListener("click", e=>{
  const b = e.target.closest(".role-btn"); if(!b) return;
  roleGrid.querySelectorAll(".role-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  pickedRole = b.dataset.role; pickedCadre = null;
  cadrePicker.classList.toggle("hidden", pickedRole!=="cadre");
  cadreGrid.querySelectorAll(".cadre-btn").forEach(x=>x.classList.remove("active"));
  checkReady();
});
cadreGrid.addEventListener("click", e=>{
  const b = e.target.closest(".cadre-btn"); if(!b) return;
  cadreGrid.querySelectorAll(".cadre-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); pickedCadre = b.dataset.cadre; checkReady();
});
nameInput.addEventListener("input", checkReady);
function checkReady(){
  enterBtn.disabled = !(nameInput.value.trim() && pickedRole && (pickedRole!=="cadre" || pickedCadre));
}
enterBtn.addEventListener("click", ()=>{
  session = { name:nameInput.value.trim(), role:pickedRole, cadre:pickedCadre };
  enterApp();
});
$("#logout-btn").addEventListener("click", ()=>{
  session = null;
  $("#app").classList.add("hidden"); $("#landing").classList.remove("hidden");
});

/* ================= 平台逻辑 ================= */
function enterApp(){
  $("#landing").classList.add("hidden"); $("#app").classList.remove("hidden");
  const roleText = {student:"学生", teacher:"教师", cadre:session.cadre}[session.role];
  $("#user-role-badge").textContent = roleText;
  $("#user-name").textContent = session.name;
  $("#f-owner").innerHTML = CADRES.map(c=>`<option ${c===session.cadre?"selected":""}>${c}</option>`).join("");
  renderAll();
}

/* Tab 切换 */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    ["submit","plaza","orders","hall"].forEach(k=>$("#tab-"+k).classList.toggle("hidden", k!==t.dataset.tab));
    renderAll();
  });
});

/* ---- 1. 问题反馈 ---- */
$("#f-submit").addEventListener("click", ()=>{
  const title = $("#f-title").value.trim(), content = $("#f-content").value.trim();
  if(!title || !content){ toast("请填写标题和问题内容"); return; }
  const now = Date.now();
  db.issues.unshift({
    id:"i"+now, type:$("#f-type").value, title, content,
    owner:$("#f-owner").value, author:session.name, status:"open",
    likes:[], createdAt:now, trace:[{t:now, text:`${session.name} 提交了问题，指定 ${$("#f-owner").value} 负责`}]
  });
  saveDB();
  $("#f-title").value=""; $("#f-content").value="";
  toast("✅ 提交成功，已通知对应班委");
  renderAll();
});

/* ---- 通用：问题卡片渲染 ---- */
function issueCard(i, opts={}){
  const liked = i.likes.includes(session.name);
  const statusMap = {open:'<span class="tag tag-status-open">待接单</span>', doing:'<span class="tag tag-status-doing">处理中</span>', resolved:'<span class="tag tag-status-done">已解决</span>'};
  const sla = slaInfo(i);
  const canAccept = opts.order && i.status==="open" && (session.role==="cadre" || session.role==="teacher");
  const canResolve = opts.order && i.status==="doing" && (session.cadre===i.owner || session.role==="teacher");
  return `<div class="issue" data-id="${i.id}">
    <div class="issue-top">
      <span class="tag tag-type">${esc(i.type)}</span>
      ${statusMap[i.status]}
      ${hotScore(i)>=8 ? '<span class="tag tag-hot">🔥 热门</span>' : ""}
      <span class="issue-title">${esc(i.title)}</span>
    </div>
    <div class="issue-content">${esc(i.content)}</div>
    <div class="issue-meta">
      <span>👤 ${esc(i.author)}</span><span>📌 负责人：${esc(i.owner)}</span><span>🕐 ${fmtTime(i.createdAt)}</span>
    </div>
    <div class="issue-actions">
      <button class="like-btn ${liked?"liked":""}" data-act="like">👍 <span>${i.likes.length}</span></button>
      ${sla ? `<span class="sla ${sla.cls}">⏱ ${sla.text}</span>` : ""}
      ${canAccept ? '<button class="act-btn act-accept" data-act="accept">接单处理</button>' : ""}
      ${canResolve ? '<button class="act-btn act-resolve" data-act="resolve">✔ 标记已解决</button>' : ""}
    </div>
    ${opts.trace ? `<div class="trace">${i.trace.map(tr=>`<div class="trace-item">${esc(tr.text)}<small>${fmtTime(tr.t)}</small></div>`).join("")}</div>` : ""}
  </div>`;
}
function bindIssueActions(container){
  container.addEventListener("click", e=>{
    const btn = e.target.closest("[data-act]"); if(!btn) return;
    const id = btn.closest(".issue").dataset.id;
    const issue = db.issues.find(x=>x.id===id); if(!issue) return;
    const act = btn.dataset.act, now = Date.now();
    if(act==="like"){
      const idx = issue.likes.indexOf(session.name);
      if(idx>=0){ issue.likes.splice(idx,1); } else { issue.likes.push(session.name); toast("👍 已点赞"); }
    }else if(act==="accept"){
      issue.status="doing"; issue.acceptedAt=now; issue.owner = session.cadre || issue.owner;
      issue.trace.push({t:now, text:`${session.name}（${session.cadre||"教师"}）接单，承诺 ${SLA_HOURS} 小时内处理`});
      toast("📥 接单成功，SLA 计时开始");
    }else if(act==="resolve"){
      issue.status="resolved"; issue.resolvedAt=now;
      const onTime = now - issue.acceptedAt <= SLA_HOURS*36e5;
      issue.trace.push({t:now, text:`${session.name}（${session.cadre||"教师"}）标记为已解决，SLA ${onTime?"达标 ✅":"超时 ⚠️"}`});
      toast("🏆 问题已归档至成就栏");
    }
    saveDB(); renderAll();
  });
}

/* ---- 渲染各板块 ---- */
function renderAll(){
  if(!session) return;
  // 我的反馈
  const mine = db.issues.filter(i=>i.author===session.name);
  $("#my-issues").innerHTML = mine.length ? mine.map(i=>issueCard(i,{trace:true})).join("") : '<div class="empty">你还没有提交过反馈</div>';

  // 问题广场（热度/最新排序 + 类型筛选）
  const filter = $("#plaza-filter").value, sort = $("#plaza-sort").value;
  let list = db.issues.filter(i=>i.status!=="resolved" && (filter==="all" || i.type===filter));
  list.sort(sort==="hot" ? (a,b)=>hotScore(b)-hotScore(a) : (a,b)=>b.createdAt-a.createdAt);
  $("#plaza-list").innerHTML = list.length ? list.map(i=>issueCard(i)).join("") : '<div class="empty">暂无相关问题</div>';

  // 班委接单
  const isCadre = session.role==="cadre" || session.role==="teacher";
  $("#orders-info").innerHTML = isCadre
    ? `<h3>接单工作台</h3><p style="font-size:13px;color:var(--muted)">你的身份：<b>${session.cadre||"教师"}</b>。处理承诺（SLA）：接单后 <b>${SLA_HOURS} 小时</b>内解决，超时将标红提醒。</p>`
    : `<h3>接单工作台</h3><p style="font-size:13px;color:var(--muted)">学生账号仅可查看班委处理进度，接单与办结操作由班委/教师执行。</p>`;
  const of = $("#orders-filter").value;
  let ol = db.issues.filter(i=>i.status!=="resolved");
  if(of==="mine") ol = ol.filter(i=>i.owner===(session.cadre||""));
  else if(of==="pending") ol = ol.filter(i=>i.status==="open");
  else if(of==="doing") ol = ol.filter(i=>i.status==="doing");
  ol.sort((a,b)=>b.createdAt-a.createdAt);
  $("#orders-list").innerHTML = ol.length ? ol.map(i=>issueCard(i,{order:true,trace:true})).join("") : '<div class="empty">暂无相关问题</div>';

  // 成就栏：已解决 + 点赞排序 + 完整留痕
  const hall = db.issues.filter(i=>i.status==="resolved").sort((a,b)=>b.likes.length-a.likes.length);
  $("#hall-list").innerHTML = hall.length ? hall.map(i=>issueCard(i,{trace:true})).join("") : '<div class="empty">还没有已解决的问题，期待班委们的第一份成绩单！</div>';
}
["#plaza-filter","#plaza-sort","#orders-filter"].forEach(s=>$(s).addEventListener("change", renderAll));
["#my-issues","#plaza-list","#orders-list","#hall-list"].forEach(s=>bindIssueActions($(s)));

/* SLA 倒计时每分钟刷新 */
setInterval(()=>{ if(session) renderAll(); }, 60000);
</script>
</body>
</html>
