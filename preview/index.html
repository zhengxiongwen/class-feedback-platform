<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="班级问题反馈平台——学生反馈、班委接单、教师监督、成果展示的一站式班级治理工具">
<title>班级问题反馈平台</title>
<style>
/* ============================================================
   CLASS GAZETTE —— 编辑式视觉系统
   取自参考设计：米白纸感 / 近黑墨色 / 单一朱红 / 极端字号对比
   零圆角、零阴影，用留白与细线建立层级
   ============================================================ */
:root{
  --paper:#f4f3ee;
  --paper-2:#eeece4;
  --ink:#141414;
  --ink-2:#5b5a52;
  --ink-3:#93918a;
  --line:#d5d2c7;
  --line-2:#e4e1d7;
  --red:#b03a2e;
  --red-bg:#f3e7e3;
  --sans:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Courier New",monospace;
  --gutter:32px;
  --muted:#93918a;--primary:#141414;--text:#141414;--bg:#f4f3ee;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:13.5px;line-height:1.65;min-height:100dvh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:1px solid var(--red);outline-offset:2px;
}
.hidden{display:none!important}
::selection{background:var(--ink);color:var(--paper)}

/* ---------- 登录 / 落地页 ---------- */
#landing{
  min-height:100dvh;display:grid;grid-template-columns:1.12fr .88fr;
  background:var(--paper);color:var(--ink);text-align:left;padding:0;
}
.land-left{
  padding:38px var(--gutter) 26px;display:flex;flex-direction:column;justify-content:space-between;
  border-right:1px solid var(--line);min-height:100dvh;
}
.land-mark{font-size:10px;letter-spacing:.24em;color:var(--ink-3);font-weight:700}
.land-body{padding:0;margin:auto 0}
#landing h1{
  font-size:clamp(40px,5.4vw,70px);line-height:.98;letter-spacing:-.02em;
  font-weight:800;margin:0;
}
#landing .slogan{
  font-size:11.5px;letter-spacing:.2em;color:var(--ink-2);opacity:1;
  margin-top:26px;padding-top:16px;border-top:1px solid var(--ink);display:inline-block;
}
.land-foot{font-size:10px;letter-spacing:.12em;color:var(--ink-3);display:flex;gap:22px;flex-wrap:wrap}
.land-right{padding:38px var(--gutter);display:flex;align-items:center;justify-content:center}
.login-card{
  background:transparent;border:0;box-shadow:none;border-radius:0;
  padding:0;width:100%;max-width:390px;text-align:left;
}
.login-card h2{font-size:10.5px;letter-spacing:.2em;color:var(--ink-3);font-weight:700;margin-bottom:20px}
.wx-btn{
  width:100%;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:0;
  padding:13px;font-size:11px;font-weight:700;letter-spacing:.18em;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s,color .15s;
}
.wx-btn:hover{background:transparent;color:var(--ink)}
.wx-btn svg{width:15px;height:15px}
.divider{
  display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:9.5px;
  letter-spacing:.2em;margin:22px 0 14px;white-space:nowrap;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.role-grid{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--line);counter-reset:role}
.role-btn{
  border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0;
  padding:12px 2px;font-size:13px;font-weight:400;text-align:left;letter-spacing:.02em;
  display:flex;align-items:center;gap:11px;transition:background .12s,color .12s,padding .12s;color:var(--ink);
  counter-increment:role;
}
.role-btn::before{
  content:"0" counter(role);font-family:var(--mono);font-size:9px;letter-spacing:.04em;
  color:var(--ink-3);flex:0 0 16px;transition:color .12s;
}
.role-btn:hover{background:var(--paper-2)}
.role-btn.active{background:var(--ink);color:var(--paper);padding-left:11px}
.role-btn.active::before{color:var(--red)}
#cadre-picker{margin-top:20px}
#cadre-picker label{font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);display:block;margin-bottom:9px}
.cadre-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:0;
  border-top:1px solid var(--line);border-left:1px solid var(--line);
}
.cadre-btn{
  border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  background:transparent;border-radius:0;padding:9px 3px;font-size:11.5px;
  color:var(--ink-2);transition:background .12s,color .12s;
}
.cadre-btn:hover{background:var(--paper-2);color:var(--ink)}
.cadre-btn.active{background:var(--ink);color:var(--paper);font-weight:400}
.name-input{
  width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;
  padding:11px 0;font-size:14px;margin-top:22px;background:transparent;color:var(--ink);
}
.name-input::placeholder{color:var(--ink-3)}
.name-input:focus{outline:none;border-bottom-color:var(--ink)}
#enter-btn{
  width:100%;margin-top:20px;background:var(--ink);color:var(--paper);
  border:1px solid var(--ink);border-radius:0;padding:13px;
  font-size:11px;font-weight:700;letter-spacing:.18em;transition:background .15s,border-color .15s,color .15s;
}
#enter-btn:hover:not(:disabled){background:var(--red);border-color:var(--red)}
#enter-btn:disabled{background:transparent;color:var(--ink-3);border-color:var(--line);cursor:not-allowed}
.login-tip{
  font-size:10px;color:var(--ink-3);margin-top:16px;text-align:left;
  letter-spacing:.05em;line-height:1.7;border-top:1px solid var(--line-2);padding-top:11px;
}

/* ---------- 应用头部 ---------- */
header{position:sticky;top:0;z-index:50;background:var(--paper);box-shadow:none;border-bottom:1px solid var(--ink)}
.header-inner{
  max-width:1180px;margin:0 auto;padding:0 var(--gutter);
  display:flex;align-items:center;gap:14px;height:54px;flex-wrap:nowrap;
}
.logo{
  font-size:11.5px;font-weight:700;letter-spacing:.2em;white-space:nowrap;
  color:var(--ink);text-transform:uppercase;
}
.user-chip{
  margin-left:auto;display:flex;align-items:center;gap:12px;font-size:10.5px;
  letter-spacing:.09em;color:var(--ink-2);white-space:nowrap;
}
.user-chip .badge{
  background:transparent;color:var(--ink);border:1px solid var(--ink);
  padding:2px 8px;font-size:9.5px;letter-spacing:.12em;font-weight:700;
}
#logout-btn{
  border:1px solid var(--line);background:transparent;border-radius:0;
  padding:4px 9px;font-size:9.5px;letter-spacing:.12em;color:var(--ink-3);
}
#logout-btn:hover{border-color:var(--ink);color:var(--ink)}

nav.tabs{
  max-width:1180px;margin:0 auto;padding:0 var(--gutter);
  display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:0;background:none;
  padding:13px 26px 12px 0;margin:0 0 -1px 0;
  font-size:10.5px;font-weight:700;letter-spacing:.15em;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap;transition:color .12s,border-color .12s;
}
.tab i{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.02em;color:var(--ink-3);margin-right:7px;vertical-align:1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab.active i{color:var(--red)}

main{max-width:1180px;margin:0 auto;padding:0 var(--gutter) 88px}

/* ---------- 版块（替代卡片） ---------- */
.card{
  background:transparent;border-radius:0;box-shadow:none;
  padding:22px 0 30px;margin:0;
  border-top:1px solid var(--ink);
}
.card+.card{border-top:1px solid var(--line);padding-top:26px}
.card h3{
  font-size:12px;font-weight:700;letter-spacing:.15em;color:var(--ink);
  margin-bottom:20px;display:flex;align-items:center;gap:10px;
}
.card h3::before{content:none;display:none}

label.f{
  display:block;font-size:9.5px;letter-spacing:.18em;color:var(--ink-3);
  margin:18px 0 5px;font-weight:700;
}
select,input[type=text],textarea{
  width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;
  padding:9px 0;font-size:14px;font-family:inherit;background:transparent;color:var(--ink);
}
select{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='6'%3E%3Cpath d='M0 0l4.5 6L9 0z' fill='%2393918a'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 2px center;padding-right:22px;
}
textarea{min-height:86px;resize:vertical;border:1px solid var(--line);padding:10px;line-height:1.7}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea:focus{border-color:var(--ink)}
.submit-btn{
  margin-top:22px;background:var(--ink);color:var(--paper);
  border:1px solid var(--ink);border-radius:0;
  padding:11px 34px;font-size:10.5px;font-weight:700;letter-spacing:.2em;
  transition:background .15s,border-color .15s;
}
.submit-btn:hover{background:var(--red);border-color:var(--red)}

/* ---------- 问题条目 ---------- */
#my-issues,#plaza-list,#orders-list,#hall-list,#trash-list{counter-reset:gi}
.issue{
  position:relative;border:0;border-top:1px solid var(--line);border-radius:0;
  padding:16px 0 18px 46px;margin:0;background:transparent;
  transition:background .12s;
}
.issue::before{
  counter-increment:gi;content:counter(gi,decimal-leading-zero);
  position:absolute;left:0;top:18px;font-family:var(--mono);
  font-size:9.5px;color:var(--ink-3);letter-spacing:.04em;
}
.issue:hover{box-shadow:none;background:var(--paper-2)}
.issue-top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.tag{
  font-size:10px;border-radius:0;padding:0;font-weight:700;
  letter-spacing:.13em;background:none;color:var(--ink-2);white-space:nowrap;
}
.tag-type{color:var(--ink-3);font-weight:400;letter-spacing:.1em}
.tag-type::before{content:"/";margin-right:9px;color:var(--line)}
.tag-status-open{color:var(--red)}
.tag-status-open::before{content:"○";margin-right:5px;font-weight:400}
.tag-status-doing{color:var(--ink)}
.tag-status-doing::before{content:"●";margin-right:5px;color:var(--ink);font-size:8px;vertical-align:1px}
.tag-status-done{color:var(--ink-2)}
.tag-status-done::before{content:"✓";margin-right:5px;font-size:9px}
.tag-status-deleted{color:var(--ink-3)}
.tag-status-deleted::before{content:"×";margin-right:5px}
.tag-hot{color:var(--red);border-bottom:1px solid var(--red);padding-bottom:1px}
.issue-title{
  font-size:15px;font-weight:700;font-size:15px;line-height:1.4;
  letter-spacing:-.008em;flex:1 1 100%;margin-top:1px;color:var(--ink);
}
.issue-content{font-size:13px;color:var(--ink-2);margin:5px 0 10px;line-height:1.75;max-width:68ch}
.issue-meta{
  font-size:10.5px;color:var(--ink-3);display:flex;gap:0;flex-wrap:wrap;
  letter-spacing:.04em;font-variant-numeric:tabular-nums;
}
.issue-meta span+span::before{content:"·";margin:0 9px;color:var(--line)}
.issue-actions{display:flex;gap:9px;margin-top:13px;align-items:center;flex-wrap:wrap}
.like-btn{
  border:1px solid var(--line);background:transparent;border-radius:0;
  padding:4px 11px;font-size:10px;letter-spacing:.08em;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;
  transition:border-color .12s,color .12s,background .12s;
}
.like-btn:hover{border-color:var(--ink);color:var(--ink)}
.like-btn.liked{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.like-btn.disliked{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.act-btn{
  border:1px solid var(--ink);border-radius:0;padding:5px 15px;
  font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--paper);background:var(--ink);
  transition:background .12s,color .12s,border-color .12s;
}
.act-accept{background:var(--ink);color:var(--paper)}
.act-accept:hover{background:var(--red);border-color:var(--red)}
.act-resolve{background:transparent;color:var(--ink)}
.act-resolve:hover{background:var(--ink);color:var(--paper)}
.act-delete{background:transparent;color:var(--red);border-color:var(--red)}
.act-delete:hover{background:var(--red);color:#fff}
.sla-select{width:auto;min-width:112px;padding:4px 20px 4px 0;font-size:10.5px}
.sla{
  font-size:10px;font-weight:700;border-radius:0;padding:0;
  letter-spacing:.1em;font-variant-numeric:tabular-nums;background:none;
}
.sla-ok{color:var(--ink-3)}
.sla-warn{color:var(--red)}
.sla-over{color:var(--red);border-bottom:2px solid var(--red);padding-bottom:1px}
.empty{text-align:left;color:var(--ink-3);padding:34px 0;font-size:11.5px;letter-spacing:.1em}
.empty::before{content:"— ";color:var(--line)}

/* ---------- 删除理由 ---------- */
.del-form{
  margin-top:14px;border:0;border-left:2px solid var(--red);background:var(--red-bg);
  border-radius:0;padding:14px 16px;
}
.del-form h4{font-size:10px;color:var(--red);margin-bottom:10px;letter-spacing:.12em;font-weight:700}
.del-form label{font-size:9.5px;color:var(--ink-3);display:block;margin:10px 0 3px;letter-spacing:.12em}
.del-form textarea{min-height:62px;background:transparent;border:1px solid var(--line);border-radius:0}
.del-form input[type=text]{border-bottom:1px solid var(--line)}
.del-form .row{display:flex;gap:9px;margin-top:13px}
.del-confirm{
  background:var(--red);color:#fff;border:1px solid var(--red);border-radius:0;
  padding:8px 18px;font-size:9.5px;font-weight:700;letter-spacing:.12em;
}
.del-confirm:hover{background:#8f2b21;border-color:#8f2b21}
.del-cancel{
  background:transparent;border:1px solid var(--line);border-radius:0;
  padding:8px 18px;font-size:9.5px;letter-spacing:.12em;color:var(--ink-2);
}
.del-cancel:hover{border-color:var(--ink);color:var(--ink)}
.del-record{
  margin-top:13px;border:0;border-left:2px solid var(--ink);background:transparent;
  border-radius:0;padding:11px 0 11px 14px;font-size:11px;line-height:1.95;color:var(--ink-2);
}
.del-record b{color:var(--ink);font-size:9.5px;letter-spacing:.16em;display:block;margin-bottom:3px}
.orig-status{
  display:inline-block;font-size:9px;font-weight:700;border-radius:0;
  padding:1px 6px;margin-left:5px;letter-spacing:.1em;border:1px solid var(--line);
}
.orig-open{background:none;color:var(--red);border-color:var(--red)}
.orig-doing{background:none;color:var(--ink);border-color:var(--ink)}
.orig-done{background:none;color:var(--ink-2);border-color:var(--line)}

/* ---------- 删除留痕分组 ---------- */
.trash-group{
  margin:0 0 30px;border-radius:0;padding:0;
  border:0;border-top:1px solid var(--ink);background:transparent!important;
}
.trash-group.g-open,.trash-group.g-doing,.trash-group.g-done{background:transparent;border-color:var(--ink)}
.trash-head{display:flex;align-items:baseline;gap:10px;margin:15px 0 2px}
.trash-title{font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--ink)}
.trash-count{
  margin-left:auto;font-size:9.5px;font-weight:700;background:none;border:0;
  border-radius:0;padding:0;color:var(--ink-3);letter-spacing:.08em;
}
.trash-desc{font-size:10.5px;color:var(--ink-3);margin-bottom:6px;letter-spacing:.04em}

/* ---------- 工作过程 ---------- */
.process{
  margin-top:14px;border:0;border-top:1px solid var(--line);
  border-radius:0;padding:0;background:transparent;
}
.process h4{
  font-size:9.5px;color:var(--ink-3);margin:11px 0 0;
  letter-spacing:.18em;font-weight:700;
}
.process ul{list-style:none;display:block;font-size:12px;color:var(--ink-2)}
.process li{
  display:grid;grid-template-columns:112px 1fr;gap:14px;
  padding:7px 0;border-bottom:1px solid var(--line-2);line-height:1.6;align-items:start;
}
.process li .k{flex-shrink:0;color:var(--ink-3);min-width:0;font-size:10.5px;letter-spacing:.08em}
.plan-edit{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.plan-edit textarea{flex:1;min-width:200px;min-height:58px;font-size:12px}
.plan-save{
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:0;
  padding:0 20px;font-size:9.5px;font-weight:700;letter-spacing:.12em;align-self:flex-end;
  min-height:36px;
}
.plan-save:hover{background:var(--red);border-color:var(--red)}

/* ---------- 留痕时间线 ---------- */
.trace{
  margin-top:14px;border-left:1px solid var(--line);padding-left:18px;
  display:flex;flex-direction:column;gap:9px;
}
.trace-item{position:relative;font-size:11px;color:var(--ink-2);line-height:1.55}
.trace-item::before{
  content:"";position:absolute;left:-22px;top:5px;width:5px;height:5px;
  border-radius:0;background:var(--paper);border:1px solid var(--ink-3);
  box-shadow:none;
}
.trace-item:first-child::before{background:var(--red);border-color:var(--red)}
.trace-item small{color:var(--ink-3);margin-left:8px;font-family:var(--mono);font-size:9.5px}

/* ---------- 筛选 ---------- */
.filter-bar{
  display:flex;gap:24px;margin:0;padding:16px 0 14px;
  border-bottom:1px solid var(--ink);flex-wrap:wrap;align-items:flex-end;
}
.filter-bar select{width:auto;min-width:140px}

/* ---------- 提示 ---------- */
.toast{
  position:fixed;left:auto;right:24px;bottom:24px;transform:none;
  background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:0;
  font-size:11px;letter-spacing:.08em;z-index:99;box-shadow:none;
  animation:up .18s ease-out;max-width:80vw;line-height:1.6;
}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- 宽屏：单列正文 + 右侧数据栏 ---------- */
.rail{display:none}
@media(min-width:881px){
  main{display:grid;grid-template-columns:minmax(0,1fr) 244px;gap:0 76px;align-items:start;padding-bottom:96px}
  main>section{max-width:860px;min-width:0}
  #tab-submit .card:first-child{max-width:600px}
  .issue-content{max-width:62ch}
  .rail{display:block;position:sticky;top:118px;border-top:1px solid var(--ink);padding-top:13px}
  .rail-block+.rail-block{margin-top:26px;border-top:1px solid var(--line);padding-top:13px}
  .rail-label{font-size:9px;letter-spacing:.2em;color:var(--ink-3);font-weight:700}
  .rail-stats{margin-top:10px;display:flex;flex-direction:column}
  .rail-stats>div{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2)}
  .rail-stats dt{font-size:10px;letter-spacing:.1em;color:var(--ink-3)}
  .rail-stats dd{font-family:var(--mono);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .rail p{font-size:10.5px;line-height:1.85;color:var(--ink-2);margin-top:9px;letter-spacing:.02em}
}

/* ---------- 窄屏 ---------- */
@media(max-width:880px){
  :root{--gutter:20px}
  #landing{grid-template-columns:1fr}
  .land-left{min-height:auto;border-right:0;border-bottom:1px solid var(--line);padding:26px 20px 22px}
  .land-body{padding:5vh 0 3vh}
  #landing h1{font-size:clamp(38px,11.5vw,64px)}
  #landing .slogan{font-size:10.5px;letter-spacing:.16em;margin-top:20px}
  .land-right{padding:26px 20px 44px;align-items:flex-start;justify-content:flex-start}
  .login-card{max-width:none}
  .header-inner{height:48px;gap:8px}
  .logo{font-size:10px;letter-spacing:.14em}
  .user-chip{gap:8px;font-size:9.5px}
  .user-chip .badge{font-size:9px;padding:2px 6px}
  #logout-btn{font-size:9px;padding:3px 7px}

<script>
"use strict";
/* ================= 数据层（GitHub 仓库 JSON 文件，多设备同步） ================= */
const CADRES = ["班长","团支书","组织委员","学习委员","文艺委员","体育委员","心理委员","宣传委员","生活委员"];
const SLA_OPTIONS = [24, 48, 72, 168];  // 承诺处理时间分段（小时）
const HOT_WINDOW = 48;                  // 热度：近48小时点赞权重加倍
const DEL_NATURES = ["重复问题","内容失实","不当言论","已线下解决","超出班级处理范围","其他"];

/* ===== 环境隔离：预览站与正式站共用同一份代码，靠 URL 路径区分 =====
   /preview/  = 预览环境（改代码先看这里，数据独立，随便测试不污染正式数据）
   /          = 正式环境（同学使用的地址）                              */
const IS_PREVIEW = location.pathname.replace(/\/+$/, "").endsWith("/preview");
const DB_KEY = IS_PREVIEW ? "class_feedback_db_preview_v1" : "class_feedback_db_v1";
if (IS_PREVIEW) {
  const badge = document.createElement("div");
  badge.textContent = "预览版 · 尚未发布";
  badge.style.cssText = "position:fixed;left:0;bottom:0;z-index:999;background:#b03a2e;color:#f4f3ee;font-size:9.5px;font-weight:700;letter-spacing:.14em;padding:5px 11px";
  document.body.appendChild(badge);
}

/* ===== jsonbin.io 数据存储配置 =====
   读取/写入：通过 jsonbin API，多设备实时同步
   并发：先拉取最新数据合并本地修改，再写入；冲突时自动重试（最多 3 次）
   注意：X-Master-Key 暴露在前端，请勿泄露给班级外人员 */
const JSONBIN_CONFIG = {
  binId: "6aeeac3aac6210605a746115",
  key: "$2a$10$x2GAteAeiSeHk2.49q4PNewwpCddCZeVkHamzy4lxGl8yVtAJJlrO",
  get readUrl(){ return `https://api.jsonbin.io/v3/b/${this.binId}/latest`; },
  get writeUrl(){ return `https://api.jsonbin.io/v3/b/${this.binId}`; }
};

let db = { issues: [] };
let dbLoaded = false;      // 是否已从云端加载
let session = null;

/* 从云端加载数据 */
async function loadDB(){
  try {
    const res = await fetch(JSONBIN_CONFIG.readUrl + "?t=" + Date.now(), {
      headers: { "X-Master-Key": JSONBIN_CONFIG.key },
      cache: "no-store"
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    const data = d.record;   // jsonbin 返回 { record: {...}, metadata: {...} }
    if (data && Array.isArray(data.issues)) {
      db = data;
      dbLoaded = true;
      console.log("[DB] 云端数据加载成功，共", db.issues.length, "条");
      return;
    }
    throw new Error("数据格式异常");
  } catch (e) {
    console.warn("[DB] 云端加载失败，使用本地备份:", e.message);
    // 降级：尝试 localStorage 备份
    try {
      const local = localStorage.getItem(DB_KEY);
      if (local) {
        const d = JSON.parse(local);
        if (d && Array.isArray(d.issues)) { db = d; dbLoaded = true; return; }
      }
    } catch (e2) {}
    // 最终降级：空数据
    db = { issues: [] };
    dbLoaded = true;
  }
}

/* 保存数据到云端（带冲突合并与重试） */
async function saveDB(){
  // 先备份到 localStorage（防止写入失败时数据丢失）
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e) {}

  if (!dbLoaded) {
    console.warn("[DB] 数据未加载完成，跳过云端保存");
    return false;
  }

  const maxRetries = 3;
  for (let i = 0; i < maxRetries; i++) {
    try {
      // 1. 先拉取云端最新数据，检测是否有其他人修改
      const latestRes = await fetch(JSONBIN_CONFIG.readUrl + "?t=" + Date.now(), {
        headers: { "X-Master-Key": JSONBIN_CONFIG.key },
        cache: "no-store"
      });
      if (latestRes.ok) {
        const latestData = (await latestRes.json()).record;
        // 如果云端数据比本地新（updated 更大），说明有人先改了，用云端数据作为基础
        if (latestData && (latestData.updated || 0) > (db.updated || 0)) {
          console.warn("[DB] 检测到云端有更新，以云端数据为基础");
          db = latestData;
          // 注意：本地的修改会丢失，提示用户刷新
          toast("数据已被其他人更新 · 请刷新查看最新内容");
          renderAll();
          return false;
        }
      }

      // 2. 更新本地时间戳
      db.updated = Date.now();

      // 3. 写入云端
      const res = await fetch(JSONBIN_CONFIG.writeUrl, {
        method: "PUT",
        headers: {
          "X-Master-Key": JSONBIN_CONFIG.key,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(db)
      });

      if (res.ok) {
        console.log("[DB] 云端保存成功");
        return true;
      }

      throw new Error(`HTTP ${res.status}`);
    } catch (e) {
      console.error(`[DB] 保存失败 (尝试 ${i+1}/${maxRetries}):`, e.message);
      if (i === maxRetries - 1) {
        toast("云端保存失败 · 已保存在本机，请检查网络后重试");
        return false;
      }
      await new Promise(r => setTimeout(r, 1000 * (i + 1))); // 指数退避
    }
  }
  return false;
}

/* 初始化：从云端加载数据，云端为空时写入演示数据 */
loadDB().then(async () => {
  if (db.issues.length === 0) {
    console.log("[DB] 云端为空，写入演示数据");
    db = seedDB();
    await saveDB();
  }
  // 数据加载完成后，如果已登录则刷新界面
  if (session) renderAll();
});

/* 定时同步：每 30 秒从云端拉取最新数据（多设备同步） */
setInterval(async () => {
  if (session && dbLoaded) {
    const oldCount = db.issues.length;
    await loadDB();
    if (db.issues.length !== oldCount) {
      renderAll(); // 数据有变化时刷新界面
    }
  }
}, 30000);

function seedDB(){
  const now = Date.now();
  const d = { issues:[
    { id:"i1", type:"学习学业", title:"晚自习教室占座严重", content:"期末周自习室座位紧张，存在用书占座一整天不来的情况，希望制定座位使用规范。", owner:"学习委员", author:"李同学", status:"resolved", likes:["a","b","c","d","e"], dislikes:["f"], createdAt:now-6*864e5, slaHours:48,
      trace:[{t:now-6*864e5, text:"李同学 提交了问题"},{t:now-5.8*864e5, text:"学习委员 接单，承诺 48 小时内处理"},{t:now-4*864e5, text:"工作安排：发布《自习座位公约》，每日 21:00 清理占座物品"},{t:now-3*864e5, text:"学习委员 标记为已解决，SLA 达标"}]},
    { id:"i2", type:"生活服务", title:"宿舍热水供应时间太短", content:"冬天热水只供应到晚上 10 点，晚自习后回去经常没热水洗澡。", owner:"生活委员", author:"王同学", status:"doing", likes:["a","b","c"], dislikes:[], createdAt:now-2*864e5, acceptedAt:now-1.5*864e5, slaHours:72, workPlan:"已与后勤处沟通，正在协商延长供应至 23:30，预计两天内给答复。",
      trace:[{t:now-2*864e5, text:"王同学 提交了问题"},{t:now-1.5*864e5, text:"生活委员 接单，承诺 72 小时内处理"},{t:now-1*864e5, text:"工作安排：已与后勤处沟通，正在协商延长供应至 23:30"}]},
    { id:"i3", type:"班级活动", title:"建议组织一次秋游团建", content:"期中后大家压力较大，建议组织一次户外团建增进感情。", owner:"文艺委员", author:"赵同学", status:"open", likes:["a","b"], dislikes:[], createdAt:now-0.5*864e5,
      trace:[{t:now-0.5*864e5, text:"赵同学 提交了问题"}]},
    { id:"i4", type:"其他", title:"（示例）一条被删除的问题", content:"该问题与「建议组织一次秋游团建」内容重复，已由班长删除。", owner:"文艺委员", author:"孙同学", status:"deleted", likes:[], dislikes:[], createdAt:now-1*864e5,
      deletion:{ by:"张班长", role:"班长", time:now-0.2*864e5, nature:"重复问题", reason:"与「建议组织一次秋游团建」内容重复，为避免分散讨论，合并到原帖处理。", originStatus:"open" },
      trace:[{t:now-1*864e5, text:"孙同学 提交了问题"},{t:now-0.2*864e5, text:"张班长（班长）删除了该问题（原为未接单状态）：重复问题"}]},
    { id:"i5", type:"生活服务", title:"（示例）处理中被删除的问题", content:"反映宿舍楼道灯损坏，后经确认已由后勤统一报修。", owner:"生活委员", author:"周同学", status:"deleted", likes:["a"], dislikes:[], createdAt:now-3*864e5, acceptedAt:now-2.6*864e5, slaHours:24,
      deletion:{ by:"张班长", role:"班长", time:now-1.2*864e5, nature:"已线下解决", reason:"该问题已由后勤处统一报修并当日修复，班委工作已实际完成，为避免重复积压予以删除。", originStatus:"doing" },
      trace:[{t:now-3*864e5, text:"周同学 提交了问题"},{t:now-2.6*864e5, text:"生活委员 接单，承诺 24 小时内处理"},{t:now-1.2*864e5, text:"张班长（班长）删除了该问题（原为处理中状态）：已线下解决"}]},
    { id:"i6", type:"班级活动", title:"（示例）完成后被删除的问题", content:"建议班级统一购买期末复习资料。", owner:"学习委员", author:"吴同学", status:"deleted", likes:["a","b","c"], dislikes:[], createdAt:now-9*864e5, acceptedAt:now-8.5*864e5, resolvedAt:now-7*864e5, slaHours:168,
      deletion:{ by:"张班长", role:"班长", time:now-2*864e5, nature:"内容失实", reason:"经核实该建议实际由学院统一采购发放，问题前提不成立，故删除已归档记录。", originStatus:"resolved" },
      trace:[{t:now-9*864e5, text:"吴同学 提交了问题"},{t:now-8.5*864e5, text:"学习委员 接单，承诺 168 小时内处理"},{t:now-7*864e5, text:"学习委员 标记为已解决，SLA 达标"},{t:now-2*864e5, text:"张班长（班长）删除了该问题（原为已完成状态）：内容失实"}]}
  ]};
  return d;
}

/* ================= 工具函数 ================= */
const $ = s => document.querySelector(s);
const fmtTime = t => new Date(t).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
function hotScore(i){
  const now = Date.now();
  return i.likes.reduce((s)=> s + (now - i.createdAt < HOT_WINDOW*36e5 ? 2 : 1), 0)
    + Math.max(0, 5 - (now-i.createdAt)/864e5);
}
function slaInfo(i){
  if(i.status!=="doing" || !i.acceptedAt) return null;
  const hours = i.slaHours || 48;
  const left = i.acceptedAt + hours*36e5 - Date.now();
  if(left < 0) return {cls:"sla-over", text:`已超时 ${Math.floor(-left/36e5)}h`};
  const h = Math.floor(left/36e5);
  return h < 12 ? {cls:"sla-warn", text:`剩余 ${h}h（即将超时）`} : {cls:"sla-ok", text:`SLA ${hours}h · 剩余 ${h}h`};
}
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const canDeleteAny = () => session && ((session.role==="cadre" && session.cadre==="班长") || session.role==="teacher");
const canOperateOrder = i => session && (session.cadre===i.owner || session.role==="teacher");

/* ================= 登录页逻辑 ================= */
const roleGrid = $("#role-grid"), cadrePicker = $("#cadre-picker"), cadreGrid = $("#cadre-grid"),
      nameInput = $("#name-input"), enterBtn = $("#enter-btn");
let pickedRole = null, pickedCadre = null;

CADRES.forEach(c=>{
  const b = document.createElement("button");
  b.className="cadre-btn"; b.textContent=c; b.dataset.cadre=c;
  cadreGrid.appendChild(b);
});
$("#wx-login").addEventListener("click", ()=> toast("微信授权成功 · 模拟"));
roleGrid.addEventListener("click", e=>{
  const b = e.target.closest(".role-btn"); if(!b) return;
  roleGrid.querySelectorAll(".role-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  pickedRole = b.dataset.role; pickedCadre = null;
  cadrePicker.classList.toggle("hidden", pickedRole!=="cadre");
  cadreGrid.querySelectorAll(".cadre-btn").forEach(x=>x.classList.remove("active"));
  checkReady();
});
cadreGrid.addEventListener("click", e=>{
  const b = e.target.closest(".cadre-btn"); if(!b) return;
  cadreGrid.querySelectorAll(".cadre-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); pickedCadre = b.dataset.cadre; checkReady();
});
nameInput.addEventListener("input", checkReady);
function checkReady(){
  enterBtn.disabled = !(nameInput.value.trim() && pickedRole && (pickedRole!=="cadre" || pickedCadre));
}
enterBtn.addEventListener("click", ()=>{
  session = { name:nameInput.value.trim(), role:pickedRole, cadre:pickedCadre };
  enterApp();
});
$("#logout-btn").addEventListener("click", ()=>{
  session = null;
  $("#app").classList.add("hidden"); $("#landing").classList.remove("hidden");
  window.scrollTo(0,0);
});

/* ================= 平台逻辑 ================= */
function enterApp(){
  $("#landing").classList.add("hidden"); $("#app").classList.remove("hidden");
  window.scrollTo(0,0);
  const roleText = {student:"学生", teacher:"教师", cadre:session.cadre}[session.role];
  $("#user-role-badge").textContent = roleText;
  $("#user-name").textContent = session.name;
  $("#f-owner").innerHTML = CADRES.map(c=>`<option ${c===session.cadre?"selected":""}>${c}</option>`).join("");
  renderAll();
}

/* Tab 切换 */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    ["submit","plaza","orders","hall","trash"].forEach(k=>$("#tab-"+k).classList.toggle("hidden", k!==t.dataset.tab));
    renderAll();
  });
});

/* ---- 1. 问题反馈 ---- */
$("#f-submit").addEventListener("click", ()=>{
  const title = $("#f-title").value.trim(), content = $("#f-content").value.trim();
  if(!title || !content){ toast("请填写标题和问题内容"); return; }
  const now = Date.now();
  db.issues.unshift({
    id:"i"+now, type:$("#f-type").value, title, content,
    owner:$("#f-owner").value, author:session.name, status:"open",
    likes:[], dislikes:[], createdAt:now,
    trace:[{t:now, text:`${session.name} 提交了问题，指定 ${$("#f-owner").value} 负责`}]
  });
  saveDB(); // 异步保存，不阻塞界面
  $("#f-title").value=""; $("#f-content").value="";
  toast("已记录 · 班长与对应班委会在接单台看到");
  renderAll();
});

/* ---- 通用：问题卡片渲染 ---- */
function issueCard(i, opts={}){
  const liked = i.likes.includes(session.name);
  const disliked = (i.dislikes||[]).includes(session.name);
  const statusMap = {
    open:'<span class="tag tag-status-open">待接单</span>',
    doing:'<span class="tag tag-status-doing">处理中</span>',
    resolved:'<span class="tag tag-status-done">已解决</span>',
    deleted:'<span class="tag tag-status-deleted">已删除</span>'
  };
  const sla = slaInfo(i);
  const canAccept = opts.order && i.status==="open" && (session.role==="cadre" || session.role==="teacher");
  const canResolve = opts.order && i.status==="doing" && canOperateOrder(i);
  // 删除入口：问题广场（未解决）+ 成就栏（已解决），要求一致
  const showDelete = (opts.plaza || opts.hall) && i.status!=="deleted" && canDeleteAny();
  const onTime = i.resolvedAt && i.acceptedAt ? (i.resolvedAt - i.acceptedAt <= (i.slaHours||48)*36e5) : null;

  /* 工作过程面板（班委接单页） */
  let processHtml = "";
  if(opts.order && (i.status==="doing" || i.status==="open")){
    const editable = i.status==="doing" && canOperateOrder(i);
    processHtml = `<div class="process">
      <h4>工作过程</h4>
      <ul>
        <li><span class="k">发布时间</span><span>${fmtTime(i.createdAt)}</span></li>
        <li><span class="k">接单时间</span><span>${i.acceptedAt ? fmtTime(i.acceptedAt) : "（尚未接单）"}</span></li>
        <li><span class="k">工作安排</span><span>${i.workPlan ? esc(i.workPlan) : "<i style='color:var(--ink-3)'>（尚未填写）</i>"}</span></li>
        <li><span class="k">办结时间</span><span>${i.resolvedAt ? fmtTime(i.resolvedAt) + (onTime===null?"":(onTime?"（按时完成）":"（超时完成）")) : "（尚未解决）"}</span></li>
      </ul>
      ${editable ? `<div class="plan-edit">
        <textarea placeholder="填写/更新你的工作安排，如：已联系后勤、计划周三前给出方案…">${esc(i.workPlan||"")}</textarea>
        <button class="plan-save" data-act="save-plan">保存工作安排</button>
      </div>` : ""}
    </div>`;
  }

  /* 删除理由表单（点击删除后展开） */
  const delFormHtml = showDelete ? `<div class="del-form hidden">
      <h4>删除理由 · 必填 · 删除后公开留痕</h4>
      <label>删除时间</label>
      <input type="text" value="${fmtTime(Date.now())}" disabled>
      <label>删除原因的性质</label>
      <select class="del-nature">${DEL_NATURES.map(n=>`<option>${n}</option>`).join("")}</select>
      <label>删除动因（请具体说明为什么删除）</label>
      <textarea class="del-reason" placeholder="例如：与另一帖子内容重复 / 经核实内容失实…"></textarea>
      <div class="row">
        <button class="del-confirm" data-act="confirm-delete">确认删除</button>
        <button class="del-cancel" data-act="cancel-delete">取消</button>
      </div>
    </div>` : "";

  /* 删除记录展示（删除任务板块） */
  const origLabel = { open:"未接单即被删除", doing:"处理中被删除", resolved:"已完成后被删除" };
  const origClsMap = { open:"orig-open", doing:"orig-doing", resolved:"orig-done" };
  const delRecordHtml = (i.status==="deleted" && i.deletion) ? `<div class="del-record">
      <b>删除记录</b> <span class="orig-status ${origClsMap[i.deletion.originStatus]||""}">${origLabel[i.deletion.originStatus]||"状态未记录"}</span><br>
      删除时间 ${fmtTime(i.deletion.time)}<br>
      原因 ${esc(i.deletion.nature)}<br>
      动因 ${esc(i.deletion.reason)}<br>
      操作人 ${esc(i.deletion.by)}（${esc(i.deletion.role)}）
    </div>` : "";

  return `<div class="issue" data-id="${i.id}">
    <div class="issue-top">
      <span class="tag tag-type">${esc(i.type)}</span>
      ${statusMap[i.status]}
      ${i.status!=="deleted" && hotScore(i)>=8 ? '<span class="tag tag-hot">热门</span>' : ""}
      <span class="issue-title">${esc(i.title)}</span>
    </div>
    <div class="issue-content">${esc(i.content)}</div>
    <div class="issue-meta">
      <span>${esc(i.author)}</span><span>负责 ${esc(i.owner)}</span><span>${fmtTime(i.createdAt)}</span>
    </div>
    <div class="issue-actions">
      <button class="like-btn ${liked?"liked":""}" data-act="like">赞同 <span>${i.likes.length}</span></button>
      ${opts.hall ? `<button class="like-btn ${disliked?"disliked":""}" data-act="dislike">反对 <span>${(i.dislikes||[]).length}</span></button>` : ""}
      ${sla ? `<span class="sla ${sla.cls}">${sla.text}</span>` : ""}
      ${canAccept ? `<select class="sla-select" title="选择承诺处理时间">${SLA_OPTIONS.map(h=>`<option value="${h}" ${h===48?"selected":""}>承诺 ${h}h 处理</option>`).join("")}</select>
        <button class="act-btn act-accept" data-act="accept">接单处理</button>` : ""}
      ${canResolve ? '<button class="act-btn act-resolve" data-act="resolve">标记已解决</button>' : ""}
      ${showDelete ? '<button class="act-btn act-delete" data-act="toggle-delete">删除</button>' : ""}
    </div>
    ${delFormHtml}
    ${delRecordHtml}
    ${processHtml}
    ${opts.trace ? `<div class="trace">${i.trace.map(tr=>`<div class="trace-item">${esc(tr.text)}<small>${fmtTime(tr.t)}</small></div>`).join("")}</div>` : ""}
  </div>`;
}

function bindIssueActions(container){
  container.addEventListener("click", e=>{
    const btn = e.target.closest("[data-act]"); if(!btn) return;
    const card = btn.closest(".issue");
    const id = card.dataset.id;
    const issue = db.issues.find(x=>x.id===id); if(!issue) return;
    const act = btn.dataset.act, now = Date.now();
    issue.dislikes = issue.dislikes || [];
    const prevStatus = issue.status;   // 记录操作前的原始状态

    if(act==="like" || act==="dislike"){
      const arr = act==="like" ? issue.likes : issue.dislikes;
      const other = act==="like" ? issue.dislikes : issue.likes;
      const idx = arr.indexOf(session.name);
      if(idx>=0){ arr.splice(idx,1); }
      else{
        arr.push(session.name);
        const oi = other.indexOf(session.name); if(oi>=0) other.splice(oi,1); // 赞/踩互斥
        toast(act==="like" ? "已赞同" : "已标记不喜欢");
      }
    }else if(act==="accept"){
      const sel = card.querySelector(".sla-select");
      const hours = sel ? parseInt(sel.value,10) : 48;
      issue.status="doing"; issue.acceptedAt=now; issue.slaHours=hours;
      issue.owner = session.cadre || issue.owner;
      issue.trace.push({t:now, text:`${session.name}（${session.cadre||"教师"}）接单，承诺 ${hours} 小时内处理`});
      toast(`接单成功 · 承诺 ${hours} 小时内处理`);
    }else if(act==="resolve"){
      issue.status="resolved"; issue.resolvedAt=now;
      const onTime = now - issue.acceptedAt <= (issue.slaHours||48)*36e5;
      issue.trace.push({t:now, text:`${session.name}（${session.cadre||"教师"}）标记为已解决，SLA ${onTime?"达标":"超时"}`});
      toast("已办结 · 归档至成就栏");
    }else if(act==="save-plan"){
      const ta = card.querySelector(".plan-edit textarea");
      const plan = ta.value.trim();
      if(!plan){ toast("请填写工作安排内容"); return; }
      issue.workPlan = plan;
      issue.trace.push({t:now, text:`工作安排：${plan.length>60 ? plan.slice(0,60)+"…" : plan}`});
      toast("工作安排已保存并留痕");
    }else if(act==="toggle-delete"){
      card.querySelector(".del-form").classList.toggle("hidden");
      return; // 仅展开表单，不触发整页重绘（保留已填内容）
    }else if(act==="cancel-delete"){
      card.querySelector(".del-form").classList.add("hidden");
      return;
    }else if(act==="confirm-delete"){
      const nature = card.querySelector(".del-nature").value;
      const reason = card.querySelector(".del-reason").value.trim();
      if(!reason){ toast("请填写删除动因"); return; }
      issue.status = "deleted";
      issue.deletion = { by:session.name, role:(session.cadre||"教师"), time:now, nature, reason,
                         originStatus: prevStatus };   // 记录删除前状态，用于删除板块分区
      const label = { open:"未接单状态", doing:"处理中状态", resolved:"已完成状态" }[prevStatus] || "";
      issue.trace.push({t:now, text:`${session.name}（${session.cadre||"教师"}）删除了该问题（原为${label}）：${nature}——${reason.length>40 ? reason.slice(0,40)+"…" : reason}`});
      toast("已删除 · 可在留痕板块查看记录");
    }
    saveDB(); // 异步保存，不阻塞界面
    renderAll();
  });
}

/* ---- 渲染各板块 ---- */
function renderAll(){
  if(!session) return;
  const alive = db.issues.filter(i=>i.status!=="deleted");

  // 我的反馈
  const mine = db.issues.filter(i=>i.author===session.name);
  $("#my-issues").innerHTML = mine.length ? mine.map(i=>issueCard(i,{trace:true})).join("") : '<div class="empty">你还没有提交过反馈</div>';

  // 问题广场
  const filter = $("#plaza-filter").value, sort = $("#plaza-sort").value;
  let list = alive.filter(i=>i.status!=="resolved" && (filter==="all" || i.type===filter));
  list.sort(sort==="hot" ? (a,b)=>hotScore(b)-hotScore(a) : (a,b)=>b.createdAt-a.createdAt);
  $("#plaza-list").innerHTML = list.length ? list.map(i=>issueCard(i,{plaza:true})).join("") : '<div class="empty">暂无相关问题</div>';

  // 班委接单
  const isCadre = session.role==="cadre" || session.role==="teacher";
  $("#orders-info").innerHTML = isCadre
    ? `<h3>接单工作台</h3><p style="font-size:13px;color:var(--muted)">你的身份：<b>${session.cadre||"教师"}</b>。接单时自选处理承诺（SLA）：<b>24 / 48 / 72 / 168 小时</b>，超时将标红提醒；处理中可随时填写「工作安排」公开进度。</p>`
    : `<h3>接单工作台</h3><p style="font-size:13px;color:var(--muted)">学生账号可查看班委处理进度与工作安排，接单与办结操作由班委/教师执行。</p>`;
  const of = $("#orders-filter").value;
  let ol = alive.filter(i=>i.status!=="resolved");
  if(of==="mine") ol = ol.filter(i=>i.owner===(session.cadre||""));
  else if(of==="pending") ol = ol.filter(i=>i.status==="open");
  else if(of==="doing") ol = ol.filter(i=>i.status==="doing");
  ol.sort((a,b)=>b.createdAt-a.createdAt);
  $("#orders-list").innerHTML = ol.length ? ol.map(i=>issueCard(i,{order:true,trace:true})).join("") : '<div class="empty">暂无相关问题</div>';

  // 成就栏：已解决 + 净好评（赞-踩）排序 + 完整留痕
  const score = i => i.likes.length - (i.dislikes||[]).length;
  const hall = alive.filter(i=>i.status==="resolved").sort((a,b)=>score(b)-score(a));
  $("#hall-list").innerHTML = hall.length ? hall.map(i=>issueCard(i,{hall:true,trace:true})).join("") : '<div class="empty">还没有已解决的问题，期待班委们的第一份成绩单！</div>';

  // 删除任务板块：按删除前状态分成三类展示
  const trashAll = db.issues.filter(i=>i.status==="deleted")
                            .map(i=>{ i._orig = (i.deletion && i.deletion.originStatus) || "open"; return i; })
                            .sort((a,b)=>b.deletion.time-a.deletion.time);
  const groups = [
    { key:"open",     title:"未接单即被删除", desc:"问题尚未被任何班委接单，就被班长删除", cls:"g-open" },
    { key:"doing",    title:"处理中被删除",   desc:"班委已接单、工作正在推进时被删除",     cls:"g-doing" },
    { key:"resolved", title:"已完成后被删除", desc:"问题已归档到成就栏后，又被删除",       cls:"g-done" }
  ];
  $("#trash-list").innerHTML = trashAll.length
    ? groups.map(g=>{
        const items = trashAll.filter(i=>i._orig===g.key);
        return `<div class="trash-group ${g.cls}">
          <div class="trash-head">
            <span class="trash-title">${g.title}</span>
            <span class="trash-count">${items.length} 条</span>
          </div>
          <p class="trash-desc">${g.desc}</p>
          ${items.length ? items.map(i=>issueCard(i,{trace:true})).join("") : '<div class="empty" style="padding:20px 0">该分类下暂无记录</div>'}
        </div>`;
      }).join("")
    : '<div class="empty">暂无被删除的问题</div>';

  updateRail();
}

/* 右侧数据栏计数 */
function updateRail(){
  const n = s => db.issues.filter(i=>i.status===s).length;
  const set = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
  set("rail-open", n("open"));
  set("rail-doing", n("doing"));
  set("rail-resolved", n("resolved"));
  set("rail-total", db.issues.filter(i=>i.status!=="deleted").length);
}
["#plaza-filter","#plaza-sort","#orders-filter"].forEach(s=>$(s).addEventListener("change", renderAll));
["#my-issues","#plaza-list","#orders-list","#hall-list","#trash-list"].forEach(s=>bindIssueActions($(s)));

/* SLA 倒计时每分钟刷新 */
setInterval(()=>{ if(session) renderAll(); }, 60000);
</script>
